[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control"
version = "0.1.0"
description = "Webcam hand-gesture desktop controller (scroll / next / previous)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "comtypes>=1.4; sys_platform == 'win32'",
    "mss>=9",
    "PySide6-Essentials>=6.5",
    "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gesture-control = "gesture_control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
