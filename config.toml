# Gesture Control configuration. Every key is optional; defaults are shown.
# Distances are in "palm sizes" (wrist -> middle-finger knuckle), so they work
# at any distance from the camera. Speeds are palm sizes per second.

dry_run = false              # true = detect and log, never send input

[camera]
index = 0
backend = "dshow"            # "dshow" | "msmf" | "any"
width = 640
height = 480
fps = 30
mirror = true                # preview behaves like a mirror (your right = screen right)

[tracker]
model_path = "models/hand_landmarker.task"
auto_download_model = true
min_detection_confidence = 0.6
min_presence_confidence = 0.6
min_tracking_confidence = 0.5
finger_extension_ratio = 1.15
open_palm_min_fingers = 4    # of index/middle/ring/pinky; lower to 3 if open palm flickers
fist_max_fingers = 0

[gestures]
smoothing_alpha = 0.6        # 1.0 = raw, lower = smoother but laggier
window_s = 0.35              # swipe must happen within this time
min_distance_vertical = 1.0  # palm sizes
min_distance_horizontal = 1.4
min_speed = 3.0              # palm sizes / s
dominance_ratio = 1.6        # main axis must be 1.6x the other axis
min_samples = 4
settle_s = 0.25              # ignore motion right after the hand appears / opens
cooldown_vertical_s = 0.25
cooldown_horizontal_s = 0.8
return_suppress_s = 0.7      # ignore the opposite direction this long after an event
invert_vertical = false      # true: hand down = scroll up
invert_horizontal = false    # true: hand right = previous

[activation]
mode = "dwell"               # "dwell" (hold palm still to arm) | "always"
arm_hold_s = 0.6
still_speed = 0.6
disarm_after_lost_s = 1.5
fist_hold_s = 0.4            # hold a fist to disarm
pause_hotkey = "ctrl+alt+p"  # global emergency pause toggle
start_paused = false

[scroll]
notches_per_swipe = 3.0      # 1 notch = one mouse-wheel click
max_speed_multiplier = 2.5   # fast swipes scroll up to 2.5x further
smooth = true
duration_s = 0.25
high_resolution = true       # set false if an app ignores small wheel steps

[navigation]
# "uia":  find a real Next/Previous button/link in the foreground window and
#         press it via Windows UI Automation (falls back to the keys below)
# "keys": always send the keys below    "none": detect and log only
mode = "uia"
fallback_to_keys = true      # used when no single clear target is found
next_keys = ["right"]        # e.g. ["alt+right"] for browser forward, ["pagedown"]
previous_keys = ["left"]
min_score = 60               # 100 = exact "Next", 70 = arrow-only "›", 60 = id-only
ambiguity_margin = 15        # refuse if a *different* target scores this close
include_back_forward = false # treat "Back"/"Forward" buttons as previous/next
extra_next_names = []        # exact extra labels, e.g. ["weiter", "suivant"]
extra_previous_names = []    # e.g. ["zurück", "précédent"]
# Never activate controls containing these words (default list shown):
# blocked_words = ["delete", "remove", "pay", "buy", "purchase", "order", "checkout",
#   "submit", "send", "sign out", "signout", "log out", "logout", "uninstall", "erase",
#   "format", "discard", "unsubscribe", "transfer", "confirm", "accept", "agree",
#   "install", "reset", "close account"]
search_timeout_s = 1.5
activation_method = "auto"   # "auto" (Invoke, else click) | "invoke" | "click"
restore_cursor = true        # move the mouse back after a click
# Screenshot + Windows OCR fallback, used only when UI Automation finds nothing
# relevant (apps without accessibility info). Local; nothing leaves the PC.
ocr_fallback = true
ocr_language = ""            # e.g. "en-US"; empty = Windows display language
ocr_scale = 1.5              # enlarge before OCR; raise to 2.0 for tiny fonts

[overlay]
# Click-through on-screen HUD + target highlight + tray icon (PySide6).
enabled = true
corner = "bottom-right"      # bottom-right | bottom-left | top-right | top-left
show_camera = true           # camera thumbnail with hand skeleton in the HUD
opacity = 0.85
highlight_targets = true     # briefly outline the Next/Previous that was pressed
margin = 16

[debug]
# OpenCV window with tuning numbers. Used automatically when the overlay is
# off or PySide6 is missing; force it with --debug-window.
show_window = false
window_always_on_top = true
draw_landmarks = true
trail_length = 20
